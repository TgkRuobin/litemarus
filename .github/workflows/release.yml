name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the main branch"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test

      - name: Build WASM and TypeScript
        run: |
          npm run compile:rust
          npm run build

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "litemarus-dist-${VERSION}.tar.gz" dist src/wasm
          zip -r "litemarus-dist-${VERSION}.zip" dist src/wasm

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "litemarus ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            litemarus-dist-*.tar.gz
            litemarus-dist-*.zip
