[package]
name = "litemarus"
version = "0.13.0"
edition = "2021"
authors = ["TgkRuobin"]
license = "GPL-3.0-only"
description = "Rust port of litemapy for reading/writing Litematica .litematic files (WASM + native)."
repository = "https://github.com/TgkRuobin/litemarus"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
valence_nbt = { version = "0.8", features = ["binary", "preserve_order"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
thiserror = "2.0"
once_cell = "1.21"
indexmap = "2.11"
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

# 生产级 WASM 加固：LTO + 单 codegen 单元 + 更小的代码体积 + 去除调试信息。
# panic = "abort" 使任何 panic 直接 trap，不向 JS 侧泄漏内部状态。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
